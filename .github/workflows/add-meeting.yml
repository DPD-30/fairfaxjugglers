name: Add meeting

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Meeting date (e.g. 01/15/2026)'
        required: true
        type: choice
        options:
          - '2026-12-03'
          - '2026-12-10'
          - '2026-12-17'
          - '2026-12-24'
          - '2026-12-31'
          - '2027-01-07'
          - '2027-01-14'
          - '2027-01-21'
          - '2027-01-28'
          - '2027-02-04'
          - '2027-02-11'
          - '2027-02-18'
          - '2027-02-25'
          - '2027-03-04'
          - '2027-03-11'
          - '2027-03-18'
          - '2027-03-25'
          - '2027-04-01'
          - '2027-04-08'
          - '2027-04-15'
          - '2027-04-22'
          - '2027-04-29'
          - '2027-05-06'
          - '2027-05-13'
          - '2027-05-20'
          - '2027-05-27'
          - '2027-06-03'
          - '2027-06-10'
          - '2027-06-17'
          - '2027-06-24'
          - '2027-07-01'
          - '2027-07-08'
          - '2027-07-15'
          - '2027-07-22'
          - '2027-07-29'
          - '2027-08-05'
          - '2027-08-12'
          - '2027-08-19'
          - '2027-08-26'
          - '2027-09-02'
          - '2027-09-09'
          - '2027-09-16'
          - '2027-09-23'
          - '2027-09-30'
          - '2027-10-07'
          - '2027-10-14'
          - '2027-10-21'
          - '2027-10-28'
          - '2027-11-04'
          - '2027-11-11'
          - '2027-11-18'
          - '2027-11-25'
          - '2027-12-02'
          - '2027-12-09'
          - '2027-12-16'
          - '2027-12-23'
          - '2027-12-30'
      location:
        description: 'Location or note (optional)'
        required: false
        default: 'John Marshall Library'
      address:
        description: 'Address (optional)'
        required: false
        default: '6209 Rose Hill Dr, Alexandria, VA 22310'
      time:
        description: 'Time (optional)'
        required: false
        default: '7-10pm'
      commit_message:
        description: 'Commit message (optional)'
        required: false
        default: 'meeting added via GITHUB workflow'

jobs:
  add_meeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Purge past meetings
        run: |
          python3 scripts/add_meeting.py --purge-past

      - name: Run add_meeting script
        run: |
          python3 scripts/add_meeting.py --date "${{ inputs.date }}" --location "${{ inputs.location }}" --address "${{ inputs.address }}" --time "${{ inputs.time }}"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/meetings.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MSG="${{ inputs.commit_message }}"
            if [ -z "$MSG" ]; then
              MSG="Add meeting ${{ inputs.date }}"
            fi
            git commit -m "$MSG" || echo "commit failed"
            git push
          fi

      - name: Trigger sync-calendar workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-calendar.yml
